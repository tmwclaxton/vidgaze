name: "Build Staging Image"

on:
  push:
    branches: [ "staging" ]
  pull_request:
    branches: [ "staging" ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  AWS_REGION: "US-EAST-1 "                  # set this to your preferred AWS region, e.g. us-west-1
  ECR_REPOSITORY: "vidgaze-laravel-app"           # set this to your Amazon ECR repository name
  ECS_SERVICE: "vidgaze_ecs_service"                 # set this to your Amazon ECS service name
  ECS_CLUSTER: "vidgaze-ecs-cluster"                 # set this to your Amazon ECS cluster name
  CONTAINER_NAME: "vidgaze_container"           # set this to the name of the container in the
  # containerDefinitions section of your task definition


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v3

      - name: ConfigureAWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{secrets.VIDGAZE_AWS_ACCESS_KEY}}
          aws-secret-access-key: ${{secrets.VIDGAZE_AWS_SECRET_ACCESS_KEY}}
          aws-region: eu-west-1

      - name: Download task definition
        id: task-def-download
        run: |
          aws ecs describe-task-definition --task-definition vidgaze-laravel-app --query taskDefinition > task-definition.json

      - name: Login to AmazonECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: docker build
        id: build-image
        env:
          ECR_REGISTRY: ${{steps.login-ecr.outputs.registry}}
          ECR_REPOSITORY: vidgaze-laravel-app
          IMAGE_TAG: "latest"

        run: |
          export WWWUSER=${WWWUSER:-$UID}
          export WWWGROUP=${WWWGROUP:-$(id -g)}
          docker-compose -f docker-compose-prod.yml build
          docker tag vidgaze-prod/app ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
          docker push ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@c804dfbdd57f713b6c079302a4c01db7017a36fc
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@df9643053eda01f169e64a0e60233aacca83799a
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
