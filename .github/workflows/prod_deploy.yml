name: "Prod Deploy"

on:
#  push:
#    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  AWS_REGION: "US-EAST-1 "                  # set this to your preferred AWS region, e.g. us-west-1
  ECR_REPOSITORY: "vidgaze-production-ecr-repository"           # set this to your Amazon ECR repository name
  ECS_SERVICE: "vidgaze-ecs-service-production"                 # set this to your Amazon ECS service name
  ECS_CLUSTER: "vidgaze-ecs-cluster-production"                 # set this to your Amazon ECS cluster name
  CONTAINER_NAME: "vidgaze-app-container-production"           # set this to the name of the container in the containerDefinitions section of your task definition
  TASK_DEFINITION: "vidgaze-laravel-app-production"           #


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v3

      - name: ConfigureAWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{secrets.VIDGAZE_AWS_ACCESS_KEY}}
          aws-secret-access-key: ${{secrets.VIDGAZE_AWS_SECRET_ACCESS_KEY}}
          aws-region: eu-west-1

      - name: Login to AmazonECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: docker build
        id: build-image
        env:
          ECR_REGISTRY: ${{steps.login-ecr.outputs.registry}}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: "latest"

        run: |
          export WWWUSER=${WWWUSER:-$UID}
          export WWWGROUP=${WWWGROUP:-$(id -g)}
          docker-compose -f docker-compose-prod.yml build
          docker tag vidgaze-prod/app ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
          docker push ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

