name: CI

on:
  pull_request:
  push:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: bcmath, gd, intl, pdo_mysql, redis, zip
          tools: composer:v2

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Composer audit
        run: composer audit --locked

      - name: Boot the app
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan route:list > /dev/null
          php artisan config:cache
          php artisan config:clear

      - name: Scraper tests (crawl4ai primary, Apify fallback)
        run: vendor/bin/phpunit tests/Unit/Scraping tests/Feature/Scraping tests/Feature/RemovedFeaturesTest.php tests/Feature/QaFixesTest.php tests/Unit/ChristianPicksTest.php tests/Unit/VideoRankerTest.php tests/Feature/RecommenderRoutesTest.php

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Production npm audit (runtime deps)
        run: npm audit --omit=dev --audit-level=high
