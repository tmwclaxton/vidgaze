version: '3'
services:
    laravel:
        build:
            context: .
            dockerfile: DockerfileProd
            args:
                WWWGROUP: '${WWWGROUP}'
        image: vidgaze-prod/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
        networks:
            - sail
networks:
    sail:
        driver: bridge
