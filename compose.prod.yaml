# Production stack for VidGaze on admin.grantgunner.org
# Usage: docker compose -p vidgaze -f compose.prod.yaml --env-file .env up -d --build
#
# The app is only reachable on the internal docker network (cloudflared -> app:8080)
# and on 127.0.0.1:${APP_HOST_PORT} for local checks. Nothing binds 0.0.0.0.

services:
  app:
    build:
      context: .
      dockerfile: DockerfileProd
      args:
        WWWGROUP: "1000"
        WWWUSER: "1337"
    image: vidgaze:latest
    container_name: vidgaze-app
    stop_grace_period: 60s
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RUN_MIGRATIONS: "true"
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8089}:8080"
    networks:
      - vidgaze
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/up"]
      interval: 15s
      retries: 20
      timeout: 5s
      start_period: 60s
    restart: unless-stopped
    volumes:
      - vidgaze-storage:/var/www/html/storage

  mysql:
    image: mysql:8.4
    container_name: vidgaze-mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - vidgaze-mysql:/var/lib/mysql
    networks:
      - vidgaze
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      retries: 20
      timeout: 5s
      start_period: 40s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: vidgaze-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - vidgaze-redis:/data
    networks:
      - vidgaze
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      retries: 10
      timeout: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    container_name: vidgaze-tunnel
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./cloudflared/credentials.json:/etc/cloudflared/credentials.json:ro
    networks:
      - vidgaze
    depends_on:
      - app
    restart: unless-stopped
    profiles: ["tunnel"]

networks:
  vidgaze:
    driver: bridge

volumes:
  vidgaze-storage:
  vidgaze-mysql:
  vidgaze-redis:
