[unix_http_server]
file=/var/run/supervisor.sock   ; (the path to the socket file)
chmod=0700                       ; sockef file mode (default 0700)

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php]
command=/usr/bin/php -d variables_order=EGPCS /var/www/html/artisan octane:start --watch --server=swoole --host=0.0.0.0 --port=80
user=sail
environment=LARAVEL_SAIL="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# this is the worker for the running the scheduler
[program:queue]
command=/bin/bash -c "sleep 60 && /usr/bin/php /var/www/html/artisan queue:work >> /dev/null 2>&1"
autostart=true
autorestart=true
user=sail
numprocs=1



[include]
files = /etc/supervisor/conf.d/vidgaze-workers/*.conf
