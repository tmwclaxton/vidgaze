[program:vidgaze-command-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/html/artisan queue:work --queue=commands --max-time=72000
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=root
numprocs=0
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/worker.log
stopwaitsecs=900
